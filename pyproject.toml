[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxcitygml"
version = "0.3.0"
description = "Voxelize CityGML data to create semantic 3D city models compatible with the VoxCity framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Kunihiko Fujiwara" },
]
keywords = ["citygml", "voxel", "3d-city-model", "urban", "gis", "plateau"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "geopandas",
    "shapely",
    "pyproj",
    "mapbox-earcut",
    "trimesh",
    "numba",
    "matplotlib",
    "seaborn",
    "contextily",
    "tqdm",
    # The assembly seam (pipeline._to_south_up) asserts voxcity's declared axis
    # contract: row 0 = the southern origin edge. voxcity reversed that
    # declaration below 1.3.2 -- 1.1.8's utils/orientation.py states north_up is
    # canonical, and its geoprocessor/mesh.py flips building_id_grid where 1.3.2
    # does not. Building against those versions silently mirrors the model.
    "voxcity>=1.3.2",
]

[project.optional-dependencies]
mesh = ["meshlib"]
all = ["meshlib"]

[project.urls]
Homepage = "https://github.com/kunifujiwara/VoxCityGML"
Repository = "https://github.com/kunifujiwara/VoxCityGML"
Issues = "https://github.com/kunifujiwara/VoxCityGML/issues"

[project.scripts]
voxcitygml = "voxcitygml.cli:main"

[tool.setuptools.packages.find]
include = ["voxcitygml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    # Debug scripts with hardcoded local paths — they error at collection time.
    "--ignore=tests/test_e2e_sample.py",
    "--ignore=tests/test_munich_debug.py",
    "--ignore=tests/test_profile_detail.py",
    "--ignore=tests/test_tree_parsing.py",
    "--ignore=tests/test_visualize.py",
    # Keep the default run fully offline: see the `network` marker below.
    "-m", "not network",
]
markers = [
    # Slow tests run by default: the PLATEAU integration test is the proof that
    # the CityGML -> VoxCity chain works end to end, and deselecting it by
    # default is the surest way for it to silently never run. Opt out with:
    #     pytest -m "not slow"
    # Point it at a local dataset with $VOXCITYGML_PLATEAU_TEST_DATA.
    "slow: long-running integration tests",
    # Unlike `slow`, this one is deselected by default, via the `-m` in
    # addopts above: live Overpass rate-limits after a few consecutive
    # fetches and then stalls *indefinitely* rather than erroring, and there
    # is no timeout plugin here, so a default run that reaches it can hang
    # forever. Opt in with:
    #     pytest -m network
    # (a command-line `-m` replaces the default one). Network tests are
    # marked `slow` as well, so the documented `-m "not slow"` override does
    # not accidentally re-select them.
    "network: needs live network access (OpenStreetMap/Overpass)",
]
