[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxcitygml"
version = "0.1.0"
description = "Voxelize CityGML data to create semantic 3D city models compatible with the VoxCity framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Kunihiko Fujiwara" },
]
keywords = ["citygml", "voxel", "3d-city-model", "urban", "gis", "plateau"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "geopandas",
    "shapely",
    "pyproj",
    "numba",
    "matplotlib",
    "seaborn",
    "contextily",
    "tqdm",
    "voxcity",
]

[project.optional-dependencies]
mesh = ["meshlib"]
all = ["meshlib"]

[project.urls]
Homepage = "https://github.com/kunifujiwara/VoxCityGML"
Repository = "https://github.com/kunifujiwara/VoxCityGML"
Issues = "https://github.com/kunifujiwara/VoxCityGML/issues"

[project.scripts]
voxcitygml = "voxcitygml.cli:main"

[tool.setuptools.packages.find]
include = ["voxcitygml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
